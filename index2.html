<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Recovery Journey Tool</title> <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Raleway:wght@300;400;500&family=Dancing+Script:wght@400;500&family=Parisienne&display=swap" rel="stylesheet"> <style> * { margin: 0; padding: 0; box-sizing: border-box; } :root { --lilac: #C8A2C8; --soft-lilac: #E6D4E6; --blush: #FFD1DC; --soft-blush: #FFEBF0; --gold: #D4AF37; --light-gold: #EBD99F; } body { font-family: 'Cormorant Garamond', serif; background: linear-gradient(135deg, #5A5A5A 0%, #6B6B6B 50%, #7A7A7A 100%); min-height: 100vh; padding: 20px; color: var(--soft-lilac); } .container { max-width: 900px; margin: 0 auto; } .progress-bar { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border-radius: 16px; padding: 20px 24px; margin-bottom: 32px; border: 1px solid rgba(200, 162, 200, 0.2); } .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; } .progress-label { font-family: 'Parisienne', cursive; font-size: 18px; color: var(--lilac); } .progress-count { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--blush); background: rgba(255, 209, 220, 0.15); padding: 6px 16px; border-radius: 20px; } .progress-track { width: 100%; height: 6px; background: rgba(200, 162, 200, 0.2); border-radius: 3px; } .progress-fill { height: 100%; background: linear-gradient(90deg, var(--soft-lilac) 0%, var(--soft-blush) 50%, var(--light-gold) 100%); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); } .card { background: rgba(90, 90, 90, 0.5); backdrop-filter: blur(25px); border-radius: 24px; padding: 60px 48px; border: 1px solid rgba(200, 162, 200, 0.2); } h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 600; background: linear-gradient(135deg, var(--lilac) 0%, var(--blush) 50%, var(--light-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 24px; } h2 { font-family: 'Playfair Display', serif; font-size: 2.6rem; color: var(--lilac); text-align: center; margin-bottom: 20px; padding-bottom: 20px; position: relative; } h2::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100px; height: 2px; background: linear-gradient(90deg, transparent, var(--lilac), var(--blush), transparent); } h3 { font-size: 1.8rem; color: var(--blush); margin-bottom: 20px; font-style: italic; } h4 { font-size: 1.4rem; color: var(--lilac); margin-bottom: 16px; font-style: italic; } p { font-size: 1.1rem; line-height: 1.7; color: rgba(230, 212, 230, 0.95); font-style: italic; } .hero-icon { text-align: center; font-size: 4.5rem; margin-bottom: 32px; animation: float 6s ease-in-out infinite; } @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } } .module-image { width: 100%; height: 320px; object-fit: cover; border-radius: 16px; margin-bottom: 40px; border: 2px solid rgba(200, 162, 200, 0.3); } .info-box { background: rgba(200, 162, 200, 0.12); border-left: 4px solid var(--lilac); padding: 28px; border-radius: 12px; margin: 32px 0; } .info-box.pink { background: rgba(255, 209, 220, 0.12); border-left-color: var(--blush); } .info-box.gold { background: rgba(212, 175, 55, 0.12); border-left-color: var(--gold); } .info-box h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--lilac); margin-bottom: 12px; } .info-box a { color: var(--blush); text-decoration: none; border-bottom: 1px solid rgba(255, 209, 220, 0.4); } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin: 40px 0; } .grid-item { background: rgba(90, 90, 90, 0.6); border: 1px solid rgba(200, 162, 200, 0.25); padding: 32px 24px; border-radius: 16px; transition: all 0.4s ease; } .grid-item:hover { transform: translateY(-4px); } .grid-item .icon { font-size: 2.8rem; margin-bottom: 20px; display: block; } label { display: block; font-weight: 500; color: var(--lilac); margin-bottom: 12px; font-size: 1.2rem; font-style: italic; } input[type="text"], input[type="date"], textarea { width: 100%; padding: 16px 20px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(200, 162, 200, 0.3); border-radius: 12px; color: rgba(230, 212, 230, 0.95); font-size: 1rem; font-family: 'Cormorant Garamond', serif; margin-bottom: 20px; } input:focus, textarea:focus { outline: none; border-color: var(--blush); box-shadow: 0 0 0 3px rgba(255, 209, 220, 0.15); } textarea { resize: vertical; min-height: 120px; } .button-group { display: flex; gap: 20px; margin-top: 40px; } button { flex: 1; padding: 18px 32px; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; transition: all 0.4s ease; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Raleway', sans-serif; } button.primary { background: linear-gradient(135deg, var(--lilac) 0%, var(--blush) 50%, rgba(212, 175, 55, 0.8) 100%); color: white; } button.primary:hover { transform: translateY(-3px); } button.secondary { background: rgba(255, 255, 255, 0.1); color: var(--lilac); border: 1px solid rgba(200, 162, 200, 0.4); } button:disabled { opacity: 0.5; cursor: not-allowed; } .handwriting { font-family: 'Dancing Script', cursive; font-size: 2rem; color: var(--blush); margin: 20px 0; text-align: center; } .gold-accent { color: var(--gold); font-weight: 500; } ul { list-style: none; margin: 20px 0; } li { line-height: 1.7; margin-bottom: 12px; padding-left: 28px; position: relative; font-style: italic; } li::before { content: '❀'; position: absolute; left: 0; color: var(--lilac); } @media (max-width: 768px) { h1 { font-size: 2.4rem; } .card { padding: 40px 24px; } .button-group { flex-direction: column; } } </style> </head> <body> <div class="container"> <div class="progress-bar"> <div class="progress-header"> <span class="progress-label">Your Journey Progress</span> <span class="progress-count" id="progressCount">1 of 7</span> </div> <div class="progress-track"> <div class="progress-fill" id="progressFill" style="width: 14.28%"></div> </div> </div> <div class="card" id="mainCard"></div> <div style="text-align: center; margin-top: 32px; color: var(--lilac); opacity: 0.8;"> <span style="font-size: 20px;">💎</span> <span> Your reflections are stored during this session</span> </div> </div> <script> let currentModule = 0; let data = { playingTape: { trigger: '', thoughts: '', actions: '', consequences: '', feelings: '' }, visionBoard: { goals: ['', '', ''] }, birthDate: '', sobrietyDate: '', numerology: null, letterToFuture: '', letterFromFuture: '' }; function updateProgress() { const p = ((currentModule + 1) / 7) * 100; document.getElementById('progressFill').style.width = p + '%'; document.getElementById('progressCount').textContent = `${currentModule + 1} of 7`; } function goToModule(i) { currentModule = i; updateProgress(); renderModule(); window.scrollTo({top: 0, behavior: 'smooth'}); } function calculateNumerology(bd, sd) { if (!bd || !sd) return null; const reduce = (n) => { while (n > 9 && n !== 11 && n !== 22 && n !== 33) { n = n.toString().split('').reduce((a, d) => a + parseInt(d), 0); } return n; }; const bDigits = bd.replace(/\D/g, ''); const lpSum = bDigits.split('').reduce((a, d) => a + parseInt(d), 0); const lp = reduce(lpSum); const bDate = new Date(bd); const yr = new Date().getFullYear(); const pySum = bDate.getDate() + (bDate.getMonth() + 1) + yr; const py = reduce(pySum); const kd = bd.replace(/\D/g, '').match(/.{1,2}/g) || []; const karmicNums = []; kd.forEach(n => { const num = parseInt(n); if ([13,14,16,19].includes(num)) karmicNums.push(num); }); const lpMeanings = { 1: { title: "The Pioneer", message: "You are a natural leader. Your recovery is about reclaiming personal power." }, 2: { title: "The Peacemaker", message: "You seek harmony. Your recovery is about finding inner peace." }, 3: { title: "The Creative Spirit", message: "Expression and joy are your gifts. Rediscover your authentic voice." }, 4: { title: "The Builder", message: "You create foundations. Every sober day is a brick in your new life." }, 5: { title: "The Freedom Seeker", message: "You crave adventure. True freedom comes through sobriety." }, 6: { title: "The Nurturer", message: "You care deeply. Learn to nurture yourself too." }, 7: { title: "The Seeker", message: "Your journey is spiritual. Sobriety will reveal profound truths." }, 8: { title: "The Powerhouse", message: "You understand abundance. Recovery returns your personal power." }, 9: { title: "The Humanitarian", message: "You have wisdom to share. Your recovery will inspire others." }, 11: { title: "The Illuminator", message: "Master number - Your sobriety will light the way for others." }, 22: { title: "The Master Builder", message: "Master number - You'll create something extraordinary." }, 33: { title: "The Master Teacher", message: "Master number - Your recovery will heal many." } }; const pyMeanings = { 1: "New Beginnings", 2: "Balance & Relationships", 3: "Self-Expression", 4: "Building Foundations", 5: "Change & Freedom", 6: "Nurturing", 7: "Introspection", 8: "Personal Power", 9: "Completion" }; const kMeanings = { 13: "Discipline & Focus", 14: "Moderation", 16: "Ego & Humility", 19: "Independence" }; return { lifePath: { number: lp, ...lpMeanings[lp] }, personalYear: { number: py, meaning: pyMeanings[py] }, karmicDebt: karmicNums.map(n => ({ number: n, meaning: kMeanings[n] })) }; } function renderWelcome() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=1200&q=80" class="module-image"> <div class="hero-icon">✨</div> <h1>Welcome to Your Recovery Journey</h1> <p class="handwriting">A Sacred Space for Healing</p> <p style="text-align: center; margin-bottom: 40px; font-size: 1.2rem;">A private, gentle place to build your vision of recovery.</p> <div class="info-box gold"> <h3>Evidence-Based Techniques</h3> <p>Using proven visualization methods from addiction recovery research.</p> </div> <h3 style="text-align: center; margin: 48px 0 24px;">Your Journey Includes:</h3> <div class="grid"> <div class="grid-item"> <div class="icon">⏮️</div> <h4>Playing the Tape Through</h4> <p>Mentally rehearse scenarios to strengthen resolve.</p> </div> <div class="grid-item"> <div class="icon">🖼️</div> <h4>Vision Board</h4> <p>Create a visual map of your recovery goals.</p> </div> <div class="grid-item"> <div class="icon">✨</div> <h4>Numerology</h4> <p>Discover your Life Path and Personal Year.</p> </div> <div class="grid-item"> <div class="icon">💌</div> <h4>Future Self Letters</h4> <p>Connect with the person you're becoming.</p> </div> </div> <div class="button-group"> <button class="primary" onclick="goToModule(1)">Begin Your Journey <span>→</span></button> </div> `; } function renderPlayingTape() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=1200&q=80" class="module-image"> <div class="hero-icon">⏮️</div> <h2>Playing the Tape Through</h2> <p style="text-align: center; margin-bottom: 32px;">Mentally rehearse a relapse scenario.</p> <div class="info-box pink"> <h3>The Science</h3> <p>Research shows rehearsing consequences improves decision-making and stress response.</p> </div> <div style="margin: 40px 0;"> <label>1. The Trigger</label> <textarea id="trigger" placeholder="What situation might lead you to consider using?">${data.playingTape.trigger}</textarea> <label>2. The Thoughts</label> <textarea id="thoughts" placeholder="What thoughts run through your mind?">${data.playingTape.thoughts}</textarea> <label>3. The Actions</label> <textarea id="actions" placeholder="What would you do?">${data.playingTape.actions}</textarea> <label>4. The Consequences</label> <textarea id="consequences" style="min-height: 160px;" placeholder="What happens next?">${data.playingTape.consequences}</textarea> <label>5. The Aftermath</label> <textarea id="feelings" placeholder="How do you feel 24 hours later?">${data.playingTape.feelings}</textarea> </div> <div class="button-group"> <button class="secondary" onclick="goToModule(0)"><span>←</span> Back</button> <button class="primary" onclick="savePlayingTape()">Continue <span>→</span></button> </div> `; } function savePlayingTape() { data.playingTape.trigger = document.getElementById('trigger').value; data.playingTape.thoughts = document.getElementById('thoughts').value; data.playingTape.actions = document.getElementById('actions').value; data.playingTape.consequences = document.getElementById('consequences').value; data.playingTape.feelings = document.getElementById('feelings').value; goToModule(2); } function renderVisionBoard() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1499343162160-cd1441923dd3?w=1200&q=80" class="module-image"> <div class="hero-icon">🖼️</div> <h2>Create Your Vision Board</h2> <p style="text-align: center; margin-bottom: 32px;">Your facilitator will guide you.</p> <div class="info-box"> <h3>The Science</h3> <p>Vision boards activate neuroplasticity and enhance goal commitment.</p> </div> <div class="info-box pink" style="margin-top: 32px;"> <h3>Facilitator-Guided Vision Board</h3> <p>Your facilitator will help you select meaningful images during your session.</p> </div> <div style="margin: 40px 0;"> <h3>Your Recovery Goals</h3> <p style="margin-bottom: 20px;">Reflect on what you want to achieve.</p> <input type="text" id="goal0" placeholder="Goal 1: e.g., Rebuild relationship with my daughter" value="${data.visionBoard.goals[0]}"> <input type="text" id="goal1" placeholder="Goal 2: e.g., Return to my career with confidence" value="${data.visionBoard.goals[1]}"> <input type="text" id="goal2" placeholder="Goal 3: e.g., Find peace and joy" value="${data.visionBoard.goals[2]}"> </div> <div class="button-group"> <button class="secondary" onclick="goToModule(1)"><span>←</span> Back</button> <button class="primary" onclick="saveVisionBoard()">Continue <span>→</span></button> </div> `; } function saveVisionBoard() { data.visionBoard.goals[0] = document.getElementById('goal0').value; data.visionBoard.goals[1] = document.getElementById('goal1').value; data.visionBoard.goals[2] = document.getElementById('goal2').value; goToModule(3); } function renderNumerology() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1515191107209-c28698631303?w=1200&q=80" class="module-image"> <div class="hero-icon">✨</div> <h2>Your Numerology Analysis</h2> <p style="text-align: center; margin-bottom: 32px;">Discover the meaning in your numbers.</p> <div class="info-box gold"> <h3>The Wisdom of Numbers</h3> <p>Numerology offers insights into your life path and personal year cycle.</p> </div> <div style="margin: 40px 0;"> <label>Your Birth Date:</label> <input type="date" id="birthDate" value="${data.birthDate}" onchange="updateNumerology()"> <label>Your Sobriety Date:</label> <input type="date" id="sobrietyDate" value="${data.sobrietyDate}" onchange="updateNumerology()"> </div> <div id="numerologyResults">${renderNumerologyResults()}</div> <div class="button-group"> <button class="secondary" onclick="goToModule(2)"><span>←</span> Back</button> <button class="primary" onclick="saveNumerology()" ${!data.birthDate || !data.sobrietyDate ? 'disabled' : ''}>Continue <span>→</span></button> </div> `; } function updateNumerology() { data.birthDate = document.getElementById('birthDate').value; data.sobrietyDate = document.getElementById('sobrietyDate').value; data.numerology = calculateNumerology(data.birthDate, data.sobrietyDate); document.getElementById('numerologyResults').innerHTML = renderNumerologyResults(); const btn = document.querySelector('.button-group .primary'); btn.disabled = !(data.birthDate && data.sobrietyDate); } function renderNumerologyResults() { if (!data.numerology) return '<p style="text-align: center; color: rgba(200, 162, 200, 0.6); margin: 40px 0;">Enter your dates to reveal insights</p>'; const n = data.numerology; return ` <div style="background: rgba(200, 162, 200, 0.15); padding: 48px; border-radius: 20px; margin: 40px 0; text-align: center;"> <div style="display: inline-block; width: 100px; height: 100px; border-radius: 50%; background: rgba(90, 90, 90, 0.8); border: 4px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 24px;">${n.lifePath.number}</div> <div style="font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--lilac); margin-bottom: 12px;">${n.lifePath.title}</div> <div style="font-size: 1.1rem; color: var(--soft-lilac); margin-bottom: 20px;">Your Life Path Number</div> <p style="font-size: 1.2rem; line-height: 1.8;">${n.lifePath.message}</p> </div> <div class="info-box pink"> <h3>Personal Year: <span class="gold-accent">${n.personalYear.number}</span></h3> <p>${n.personalYear.meaning}</p> </div> ${n.karmicDebt.length > 0 ? ` <div class="info-box"> <h3>Karmic Debt Numbers</h3> ${n.karmicDebt.map(k => `<p style="margin: 12px 0;"><strong>${k.number}:</strong> ${k.meaning}</p>`).join('')} </div> ` : ''} `; } function saveNumerology() { goToModule(4); } function renderLetterToFuture() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1455849318743-b2233052fcff?w=1200&q=80" class="module-image"> <div class="hero-icon">💌</div> <h2>Letter to Your Future Self</h2> <p style="text-align: center; margin-bottom: 32px;">Write to yourself one year from now.</p> <div class="info-box gold"> <h3>The Science</h3> <p>Creating vivid scenes of substance-free life enhances self-efficacy.</p> </div> <div class="info-box"> <h3>Prompts:</h3> <ul> <li>What do you hope your life looks like in one year?</li> <li>What are you most afraid of right now?</li> <li>What promises do you want to make?</li> </ul> </div> <div style="margin: 40px 0;"> <textarea id="letterToFuture" style="min-height: 450px;" placeholder="Dear Future Me, Today is the beginning...">${data.letterToFuture}</textarea> </div> <div class="button-group"> <button class="secondary" onclick="goToModule(3)"><span>←</span> Back</button> <button class="primary" onclick="saveLetterToFuture()">Continue <span>→</span></button> </div> `; } function saveLetterToFuture() { data.letterToFuture = document.getElementById('letterToFuture').value; goToModule(5); } function renderLetterFromFuture() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1501139083538-0139583c060f?w=1200&q=80" class="module-image"> <div class="hero-icon">❤️</div> <h2>Letter from Your Future Self</h2> <p style="text-align: center; margin-bottom: 32px;">Step into the shoes of your recovered self.</p> <div class="info-box pink"> <h3>This is powerful</h3> <p>Imagine yourself one year from now—sober, thriving. What would you say to today's you?</p> </div> <div class="info-box"> <h3>Writing as your future self:</h3> <ul> <li>What you're most proud of achieving</li> <li>How you got through hard moments</li> <li>What you wish you had known</li> </ul> </div> <div style="margin: 40px 0;"> <textarea id="letterFromFuture" style="min-height: 450px;" placeholder="Dear Past Me, You made it...">${data.letterFromFuture}</textarea> </div> <div class="button-group"> <button class="secondary" onclick="goToModule(4)"><span>←</span> Back</button> <button class="primary" onclick="saveLetterFromFuture()">Complete <span>→</span></button> </div> `; } function saveLetterFromFuture() { data.letterFromFuture = document.getElementById('letterFromFuture').value; goToModule(6); } function renderCompletion() { document.getElementById('mainCard').innerHTML = ` <img src="https://images.unsplash.com/photo-1502139214982-d0ad755818d8?w=1200&q=80" class="module-image"> <div class="hero-icon">🏆</div> <h1>Your Recovery Journey is Complete</h1> <p class="handwriting">You've done sacred work today</p> <div class="info-box gold"> <h3 style="text-align: center; font-size: 1.5rem; margin-bottom: 24px;">What You Created:</h3> <div style="display: flex; flex-direction: column; gap: 20px;"> <div style="display: flex; align-items: center; gap: 20px; padding: 16px; background: rgba(90, 90, 90, 0.4); border-radius: 12px;"> <span style="font-size: 2rem;">⏮️</span> <div><p style="font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--lilac); margin-bottom: 4px; font-size: 1.2rem;">Playing the Tape Through</p>
                                <p style="font-size: 0.95rem;">Understanding consequences</p>
                            </div>

                            </div>

                        <div style="display: flex; align-items: center; gap: 20px; padding: 16px; background: rgba(90, 90, 90, 0.4); border-radius: 12px;">
                            <span style="font-size: 2rem;">💌</span>
                            <div>
                                <p style="font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--lilac); margin-bottom: 4px; font-size: 1.2rem;">Future Self Letters</p>
                                <p style="font-size: 0.95rem;">Connection and wisdom</p>
                            </div>
